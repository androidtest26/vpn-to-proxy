name: ovpn-nginx-proxy

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Telegram file_id of .ovpn"
        required: true
      chat_id:
        description: "Telegram chat id"
        required: true
      minutes:
        description: "Koto minute cholbe (max 340)"
        default: "60"

env:
  TG: ${{ secrets.TG_BOT_TOKEN }}
  CHAT: ${{ inputs.chat_id }}

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openvpn nginx curl jq
          sudo systemctl stop nginx || true

      - name: Download .ovpn from Telegram
        run: |
          FP=$(curl -s "https://api.telegram.org/bot$TG/getFile" \
            --data-urlencode "file_id=${{ inputs.file_id }}" | jq -r .result.file_path)
          curl -fsSL "https://api.telegram.org/file/bot$TG/$FP" -o /tmp/client.ovpn

      - name: Start OpenVPN
        run: |
          sudo openvpn --config /tmp/client.ovpn \
            --route-nopull --daemon --log /tmp/ovpn.log
          for i in $(seq 1 40); do
            ip -4 addr show tun0 >/dev/null 2>&1 && break
            sleep 1
          done
          if ! ip -4 addr show tun0 >/dev/null 2>&1; then
            curl -s "https://api.telegram.org/bot$TG/sendMessage" \
              -d chat_id="$CHAT" -d text="VPN connect hoyni. .ovpn file ta check korun."
            exit 1
          fi
          TUN_IP=$(ip -4 -o addr show tun0 | awk '{print $4}' | cut -d/ -f1)
          echo "TUN_IP=$TUN_IP" >> $GITHUB_ENV
          sudo ip route add default dev tun0 table 100
          sudo ip rule add from "$TUN_IP" table 100
          VPN_IP=$(curl -s --max-time 15 --interface "$TUN_IP" https://api.ipify.org)
          echo "VPN_IP=$VPN_IP" >> $GITHUB_ENV

      - name: Start nginx with random token
        run: |
          TOKEN=$(openssl rand -hex 12)
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          AUTH=$(printf 'proxy:%s' "$TOKEN" | base64)
          cat > /tmp/nginx.conf <<EOF
          pid /tmp/nginx.pid;
          events {}
          http {
            access_log off;
            error_log /tmp/nginx-error.log;
            server {
              listen 8080;
              resolver 1.1.1.1 ipv6=off;
              proxy_bind $TUN_IP;
              if (\$http_proxy_authorization != "Basic $AUTH") { return 407; }
              location / {
                proxy_pass http://\$host\$request_uri;
                proxy_set_header Host \$host;
                proxy_set_header Proxy-Authorization "";
              }
            }
          }
          EOF
          sudo nginx -c /tmp/nginx.conf

      - name: Public kore Telegram e pathao
        run: |
          curl -fsSL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar xz
          nohup ./bore local 8080 --to bore.pub > /tmp/bore.log 2>&1 &
          sleep 6
          ADDR=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore.log | head -1)
          MSG="Proxy ready
          VPN IP: $VPN_IP
          Address: $ADDR
          User: proxy
          Token: $TOKEN
          Test: curl -x http://proxy:$TOKEN@$ADDR http://api.ipify.org
          Cholbe: ${{ inputs.minutes }} minute"
          curl -s "https://api.telegram.org/bot$TG/sendMessage" \
            --data-urlencode chat_id="$CHAT" --data-urlencode text="$MSG" >/dev/null

      - name: Keep alive
        run: sleep $(( ${{ inputs.minutes }} * 60 ))

      - name: Notify finish
        if: always()
        run: |
          curl -s "https://api.telegram.org/bot$TG/sendMessage" \
            -d chat_id="$CHAT" -d text="Proxy bondho hoye geche." >/dev/null
